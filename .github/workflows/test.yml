name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            homeassistant-version: "2024.11.0"
            compatibility-requirements: "homeassistant==2024.11.0 josepy==1.14.0"
          - python-version: "3.14.2"
            homeassistant-version: "2026.9.0"
            compatibility-requirements: "homeassistant==2026.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements-test.txt \
            ${{ matrix.compatibility-requirements }}

      - name: Run tests
        run: >-
          pytest tests/ -v
          --cov=custom_components.axeos_ha_integration
          --cov-report=term-missing
          --cov-fail-under=80

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"

      - name: Install Ruff
        run: pip install ruff==0.16.6

      - name: Run Ruff
        run: ruff check .
